[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcodex-art"
version = "0.1.0"
description = "WorldCodex image generation CLI"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
]

[project.scripts]
worldcodex-art = "worldcodex_art.main:main"
